# XcodeGen 프로젝트 정의 (DEC-010). `xcodegen generate`로 Onoff.xcodeproj를 만든다 — .xcodeproj는 커밋하지 않는다.
name: Onoff
options:
  bundleIdPrefix: app.onoff
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ko
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Onoff:
    type: application
    platform: iOS
    sources:
      - path: Onoff
    info:
      # 생성 파일 — 고칠 때는 여기(project.yml)를 고친다
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: 온오프
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [PretendardVariable.ttf, InstrumentSerif-Regular.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onoff.ios
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
  OnoffTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OnoffTests
      - path: ../shared/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Onoff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.onoff.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Onoff.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Onoff
schemes:
  Onoff:
    build:
      targets:
        Onoff: all
        OnoffTests: [test]
    test:
      targets:
        - OnoffTests
