# CI — 실제로 있는 검사만 실행한다. 명령은 로컬과 같은 verify.sh를 쓴다.
# 영역을 추가할 때: .claude/project.sh 에 verify_<영역> 을 만들고 아래에 job을 복사한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation:
    name: Claude 자동화 파일 (스크립트 문법 · settings.json · hook)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh .claude/skills/finish-feature/scripts/verify.sh claude

  # Android 단위 테스트 — apps/android 뼈대와 verify_android가 생기면 주석을 푼다(리눅스에서 돈다).
  # iOS는 macOS 러너가 느리고 비싸서 로컬 verify_ios 결과를 PR 본문에 붙인다(docs/conventions/git.md).
